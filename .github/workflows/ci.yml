name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: npx --yes pnpm@9.12.0 install --frozen-lockfile
      - run: npx --yes pnpm@9.12.0 build
      - run: npx --yes pnpm@9.12.0 test
      - run: cargo fmt --manifest-path server/Cargo.toml -- --check
      - run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings
