name: Compare QUIC and WSS
on: workflow_dispatch
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npx --yes pnpm@9.12.0 install --frozen-lockfile
      - run: npx --yes pnpm@9.12.0 exec playwright install --with-deps chromium
      - run: npx --yes pnpm@9.12.0 build:benchmark
      - run: npx --yes pnpm@9.12.0 test:transports
      - run: npx --yes pnpm@9.12.0 compare
      - run: node scripts/report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transport-comparison
          path: |
            artifacts/
            comparison/
