[package]
name = "quic-fleet-live"
version = "0.1.0"
edition = "2021"
[dependencies]
wtransport = { version = "0.7.2", features = ["quinn"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rcgen = "0.13"
time = "0.3"
ring = "0.17"
base64 = "0.22"
tracing = "0.1"

tokio-tungstenite = "0.24"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
futures-util = "0.3"
libc = "0.2"
